<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵动画</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif
  }
  .card{
    background:#16213e;border-radius:20px;padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center
  }
  h1{color:#e94560;font-size:24px;margin-bottom:24px;font-weight:600;letter-spacing:.5px}
  .sprite-wrapper{
    position:relative;width:177px;height:177px;margin:0 auto 28px;border-radius:12px;overflow:hidden
  }
  .sprite{width:100%;height:100%;background-repeat:no-repeat;image-rendering:pixelated}
  .sprite.forward{
    background-image:url("spritesheet2_forward.png");
    background-size:7080px 177px;
    animation:play-fwd 6.0s steps(40) infinite
  }
  @keyframes play-fwd{from{background-position:0 0}to{background-position:-7080px 0}}
  .sprite.loop{
    background-image:url("spritesheet2_loop.png");
    background-size:13806px 177px;
    animation:play-loop 11.7s steps(78) infinite
  }
  @keyframes play-loop{from{background-position:0 0}to{background-position:-13806px 0}}
  .sprite.paused{animation-play-state:paused!important}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .controls button{
    padding:8px 20px;border:2px solid #0f3460;border-radius:10px;
    background:#1a1a2e;color:#eee;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit
  }
  .controls button:hover{background:#0f3460;border-color:#e94560}
  .controls button.active{background:#e94560;border-color:#e94560;color:#fff}
  .controls label{color:#aaa;font-size:13px;display:flex;align-items:center;gap:6px}
  .controls input[type=range]{width:80px;accent-color:#e94560}
  .controls .speed-value{color:#eee;font-size:13px;min-width:36px;text-align:center}
  .status{color:#888;font-size:12px;margin-top:20px;letter-spacing:.3px}
  @media(max-width:480px){.card{padding:24px}}
</style>
</head>
<body>
<div class="card">
  <h1>🎬 精灵动画</h1>
  <div class="sprite-wrapper"><div class="sprite loop" id="sprite"></div></div>
  <div class="controls">
    <button id="btnPlay" class="active">▶ 播放</button>
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnForward">→ 正向</button>
    <button id="btnLoop" class="active">↔ 循环</button>
    <label>速度<input type="range" id="speedRange" min="0.25" max="4" step="0.25" value="1">
    <span class="speed-value" id="speedDisplay">1×</span></label>
  </div>
  <div class="status" id="status">模式: 循环 | 速度: 1× | 🎞 78 帧</div>
</div>
<script>
  const s=document.getElementById('sprite'),bP=document.getElementById('btnPlay'),
        bPause=document.getElementById('btnPause'),bF=document.getElementById('btnForward'),
        bL=document.getElementById('btnLoop'),sR=document.getElementById('speedRange'),
        sD=document.getElementById('speedDisplay'),st=document.getElementById('status');
  let m='loop';
  function setMode(mode){
    m=mode;s.classList.remove('forward','loop','paused');
    if(mode==='forward'){s.classList.add('forward');bF.classList.add('active');bL.classList.remove('active');
      st.textContent=`模式: 正向 | 速度: ${sR.value}× | 🎞 40 帧`}
    else{s.classList.add('loop');bL.classList.add('active');bF.classList.remove('active');
      st.textContent=`模式: 循环 | 速度: ${sR.value}× | 🎞 78 帧`}
    void s.offsetWidth;s.style.animation='none';void s.offsetWidth;s.style.animation=''}
  function play(){s.classList.remove('paused');bP.classList.add('active');bPause.classList.remove('active')}
  function pause(){s.classList.add('paused');bPause.classList.add('active');bP.classList.remove('active')}
  function setSpeed(v){
    const d=m==='forward'?6.0/parseFloat(v):11.7/parseFloat(v);
    s.style.animationDuration=d+'s';sD.textContent=v+'×'}
  bP.addEventListener('click',play);bPause.addEventListener('click',pause);
  bF.addEventListener('click',()=>setMode('forward'));
  bL.addEventListener('click',()=>setMode('loop'));
  sR.addEventListener('input',()=>{setSpeed(sR.value);
    st.textContent=`模式: ${m==='forward'?'正向':'循环'} | 速度: ${sR.value}× | 🎞 ${m==='forward'?40:78} 帧`});
</script>
</body>
</html>
