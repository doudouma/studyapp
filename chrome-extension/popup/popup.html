<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100mini Hosting</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 16 4-4-4-4"/>
            <path d="m6 8-4 4 4 4"/>
            <path d="m14.5 4-5 16"/>
          </svg>
        </div>
        <span class="header-title">100mini</span>
      </div>

    </header>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="upload" role="tab" aria-selected="true">Upload</button>
      <button class="tab" data-tab="pages" role="tab" aria-selected="false">My Pages</button>
    </div>

    <!-- Tab: Upload -->
    <div id="tab-upload" class="tab-content active" role="tabpanel">
      <div class="upload-modes">
        <button class="mode-btn active" data-mode="paste">Paste Code</button>
        <button class="mode-btn" data-mode="file">Upload File</button>
      </div>

      <!-- Paste mode -->
      <div id="upload-paste" class="upload-panel active">
        <textarea
          id="htmlInput"
          class="textarea"
          placeholder="Paste HTML code here..."
          spellcheck="false"
        ></textarea>
        <div class="size-hint">
          <span id="sizeDisplay">0 B</span>
          <span> / 5 MB</span>
        </div>
      </div>

      <!-- File mode -->
      <div id="upload-file" class="upload-panel dropzone-wrapper">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="dropzone-text">Drop .html or .zip file here</div>
          <div class="dropzone-sub">or click to select a file</div>
          <input type="file" id="fileInput" accept=".html,.htm,.zip" class="hidden-input">
        </div>
        <div id="fileInfo" class="file-info hidden">
          <div class="file-info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="file-info-name" id="fileName"></div>
          <div class="file-info-size" id="fileSize"></div>
          <button class="btn-icon-small" id="removeFileBtn" title="Remove">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Options (visible for logged-in users only) -->
      <div id="authOptions" class="auth-section hidden">
        <div class="field">
          <label class="label">Title <span class="required">*</span></label>
          <input type="text" id="titleInput" class="input" placeholder="Name your page">
        </div>
        <div class="field">
          <label class="label">Category</label>
          <select id="categorySelect" class="input">
            <option value="general">General</option>
            <option value="chinese">Chinese</option>
            <option value="math">Math</option>
            <option value="english">English</option>
            <option value="physics">Physics</option>
            <option value="chemistry">Chemistry</option>
            <option value="history">History</option>
            <option value="biology">Biology</option>
            <option value="geography">Geography</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Tags</label>
          <input type="text" id="tagsInput" class="input" placeholder="Separate with commas">
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="shareCheck">
          Share to Square
        </label>
      </div>

      <!-- Anonymous info -->
      <div id="anonymousInfo" class="anonymous-info">
        <div class="anonymous-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Anonymous Upload (7d expiry)
        </div>
        <div class="anonymous-badges">
          <span class="badge badge-warning">⏳ Auto-destroy in 7d</span>
          <span class="badge badge-success">No login needed</span>
        </div>
        <button id="loginBtn" class="btn btn-secondary btn-sm">Log in for permanent storage</button>
      </div>

      <!-- Error -->
      <div id="errorMsg" class="error hidden"></div>

      <!-- Upload button -->
      <button id="uploadBtn" class="btn btn-primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload & Host
      </button>

      <!-- Loading -->
      <div id="uploadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <div class="overlay-text">Uploading...</div>
      </div>

      <!-- Result -->
      <div id="resultCard" class="result-card hidden">
        <div class="result-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#006c49" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="result-heading">Upload Successful!</div>
        <div class="result-url-wrapper">
          <input type="text" id="resultUrl" class="input result-url" readonly>
          <button id="copyUrlBtn" class="btn btn-secondary btn-sm">Copy</button>
        </div>
        <div class="result-actions">
          <button id="openUrlBtn" class="btn btn-secondary btn-sm">Open in new tab</button>
          <button id="resetBtn" class="btn btn-ghost btn-sm">Upload more</button>
        </div>
      </div>
    </div>

    <!-- Tab: My Pages -->
    <div id="tab-pages" class="tab-content" role="tabpanel">
      <div id="pagesLoginPrompt" class="login-prompt">
        <div class="login-prompt-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="login-prompt-text">Log in to view your hosted pages</div>
        <button id="pagesLoginBtn" class="btn btn-primary btn-sm">Go to login</button>
      </div>

      <div id="pagesList" class="pages-list hidden">
        <div class="pages-header">
          <span id="pagesCount" class="pages-count">0 pages</span>
          <button id="refreshPagesBtn" class="btn-icon" title="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
        <div id="pagesContainer"></div>
        <div id="pagesLoading" class="loading-dots">Loading...</div>
        <div id="pagesError" class="error hidden"></div>
        <div id="pagesEmpty" class="empty-state hidden">
          <div class="empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="empty-text">No hosted pages yet</div>
          <div class="empty-sub">Switch to the Upload tab to get started</div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
