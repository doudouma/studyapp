<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>题型闯关 · 词形词性转化 · 交互刷题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 860px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 28px 30px 34px;
            transition: all 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b1b33;
            letter-spacing: -0.3px;
        }
        .header h1 small {
            font-weight: 500;
            font-size: 14px;
            color: #5b6f8c;
            margin-left: 10px;
        }

        .stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 14px;
            background: #f0f4fa;
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
            align-items: center;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #1f334f;
        }
        .stats .num {
            font-weight: 700;
            color: #0b1b33;
            min-width: 22px;
        }
        .stats .badge {
            background: #dce4f0;
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #1f3a5f;
        }
        .stats .badge.error {
            background: #fee9e7;
            color: #b34033;
        }

        .progress-wrap {
            width: 100%;
            height: 5px;
            background: #e6edf6;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b7bff, #6c9bff);
            border-radius: 10px;
            transition: width 0.35s ease;
        }

        .question-card {
            background: #f9fbfe;
            border-radius: 20px;
            padding: 24px 26px 26px;
            border: 1px solid #e9eef5;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #5f748f;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .q-meta .q-id {
            font-weight: 600;
            color: #1f334f;
            background: #e6edf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 26px;
        }
        .q-meta .q-source {
            background: #eef3fa;
            padding: 0 14px;
            border-radius: 30px;
            line-height: 26px;
        }

        .q-text {
            font-size: 18px;
            line-height: 1.7;
            color: #0b1b33;
            margin-bottom: 16px;
            word-break: break-word;
        }
        .q-text .blank-input {
            display: inline-block;
            width: 140px;
            max-width: 70%;
            border: none;
            border-bottom: 2.5px dashed #7a93b8;
            background: transparent;
            font-size: 18px;
            font-weight: 500;
            color: #0b1b33;
            padding: 0 4px;
            transition: border-color 0.2s, background 0.15s;
            outline: none;
            font-family: inherit;
        }
        .q-text .blank-input:focus {
            border-bottom-color: #3b7bff;
            background: #eef4ff;
            border-radius: 4px 4px 0 0;
        }
        .q-text .blank-input.correct {
            border-bottom-color: #1f9d6a;
            background: #e5f5ee;
        }
        .q-text .blank-input.wrong {
            border-bottom-color: #d14c3c;
            background: #fdeeeb;
        }

        .q-hint {
            font-size: 14px;
            color: #5f748f;
            background: #edf2f9;
            display: inline-block;
            padding: 2px 16px;
            border-radius: 40px;
            margin-top: 4px;
        }
        .q-hint strong {
            color: #1f3a5f;
            font-weight: 600;
        }

        /* feedback */
        .feedback {
            margin-top: 16px;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        .feedback.show {
            display: flex;
        }
        .feedback .fb-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .feedback.correct {
            background: #e4f4ec;
            color: #0f6e4a;
            border: 1px solid #b7dfce;
        }
        .feedback.wrong {
            background: #fdeeeb;
            color: #aa3c2e;
            border: 1px solid #f5d3cd;
        }
        .feedback .fb-answer {
            font-weight: 700;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 14px;
            border-radius: 30px;
        }
        .feedback .fb-explanation {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 2px;
            line-height: 1.6;
            color: #1f334f;
        }
        .feedback .fb-explanation strong {
            color: #0b1b33;
        }

        /* actions */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-top: 6px;
            align-items: center;
            justify-content: space-between;
        }
        .actions-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .actions-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            background: #eef3fa;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #1f334f;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #1f3a5f;
            color: #fff;
        }
        .btn-primary:hover {
            background: #142b47;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #1f9d6a;
            color: #fff;
        }
        .btn-success:hover {
            background: #178358;
        }
        .btn-danger {
            background: #d14c3c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b33f31;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #cbd7e8;
        }
        .btn-outline:hover {
            background: #eef3fa;
            border-color: #a0b5cf;
        }
        .btn-outline-secondary {
            background: transparent;
            border: 1.5px solid #cbd7e8;
            color: #3d5779;
        }
        .btn-outline-secondary:hover {
            background: #eef3fa;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }

        /* modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 27, 51, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #fff;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            border-radius: 28px;
            padding: 28px 30px 30px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .modal-header h2 {
            font-size: 22px;
            color: #0b1b33;
        }
        .modal-header h2 small {
            font-weight: 400;
            font-size: 15px;
            color: #5f748f;
            margin-left: 8px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            line-height: 1;
            color: #7a8fa8;
            cursor: pointer;
            padding: 0 8px;
        }
        .modal-close:hover {
            color: #0b1b33;
        }
        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #eef3fa;
            border-radius: 10px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #c2d2e6;
            border-radius: 10px;
        }

        .error-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #f9fbfe;
            border-radius: 14px;
            margin-bottom: 8px;
            border: 1px solid #edf2f9;
            gap: 12px;
            flex-wrap: wrap;
        }
        .error-item .e-text {
            font-size: 15px;
            color: #0b1b33;
            flex: 1;
            min-width: 140px;
        }
        .error-item .e-answer {
            font-weight: 600;
            color: #1f9d6a;
            background: #e4f4ec;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 14px;
            line-height: 28px;
            white-space: nowrap;
        }
        .error-item .e-index {
            font-weight: 600;
            color: #5f748f;
            background: #eef3fa;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 13px;
            line-height: 26px;
        }
        .empty-errors {
            text-align: center;
            padding: 40px 10px;
            color: #5f748f;
            font-size: 16px;
        }
        .empty-errors .icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .api-settings {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .api-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .api-panel input {
            border: 1.5px solid #cbd7e8;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 240px;
            max-width: 50vw;
            transition: border-color 0.2s;
        }
        .api-panel input:focus {
            border-color: #3b7bff;
        }
        .api-status {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .api-status.ok {
            color: #1f9d6a;
        }
        .api-status.err {
            color: #d14c3c;
        }
        .api-status.loading {
            color: #5f748f;
        }
        .ai-loading {
            display: none;
            text-align: center;
            padding: 30px 10px;
            color: #5f748f;
        }
        .ai-loading.show {
            display: block;
        }
        .ai-loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e6edf6;
            border-top-color: #3b7bff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .ai-result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .app {
                padding: 18px 14px 24px;
            }
            .header h1 {
                font-size: 20px;
            }
            .stats {
                font-size: 12px;
                padding: 4px 12px;
                gap: 10px;
            }
            .q-text {
                font-size: 16px;
            }
            .q-text .blank-input {
                font-size: 16px;
                width: 110px;
            }
            .question-card {
                padding: 18px 16px 20px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .actions-left,
            .actions-right {
                justify-content: center;
            }
            .btn {
                padding: 8px 16px;
                font-size: 13px;
                justify-content: center;
            }
            .modal {
                padding: 20px 16px;
                max-height: 90vh;
            }
            .modal-header h2 {
                font-size: 19px;
            }
            .error-item {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .error-item .e-answer {
                align-self: flex-start;
            }
        }
        @media (max-width: 400px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .stats {
                justify-content: center;
            }
            .q-meta {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- header -->
        <div class="header">
            <h1>
                📝 词形词性转化
                <small>题型闯关 · 含近5年真题+模拟</small>
            </h1>
            <div class="stats" id="statsBar">
                <span>📌 <span class="num" id="totalNum">0</span></span>
                <span>✅ <span class="num" id="correctNum">0</span></span>
                <span>❌ <span class="num" id="wrongNum">0</span></span>
                <span class="badge" id="progressLabel">0 / 30</span>
                <span class="badge error" id="errorBookBadge">📕 错题 0</span>
                <span class="badge" id="aiBankBadge" style="display:none;">🤖 AI 题 0</span>
            </div>
        </div>

        <!-- api settings -->
        <div class="api-settings" style="display:none;">
            <button class="btn btn-sm btn-outline-secondary" id="apiSettingsBtn">🔑 API</button>
            <div class="api-panel" id="apiPanel" style="display:none">
                <input type="password" id="apiKeyInput" placeholder="DeepSeek API Key" />
                <button class="btn btn-sm btn-primary" id="verifyApiBtn">验证</button>
                <span class="api-status" id="apiStatus"></span>
            </div>
        </div>

        <!-- loading state -->
        <div id="loadingState" style="text-align:center;padding:60px 20px;color:#5f748f;">
            <div style="display:inline-block;width:32px;height:32px;border:3px solid #e6edf6;border-top-color:#3b7bff;border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:12px;"></div>
            <div style="font-size:15px;">加载题库中…</div>
        </div>

        <!-- progress -->
        <div class="progress-wrap" id="progressWrap" style="display:none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- question card -->
        <div class="question-card" id="questionCard" style="display:none;">
            <div class="q-meta">
                <span class="q-id" id="qIdLabel">第 1 题</span>
                <span class="q-source" id="qSourceLabel">基础题</span>
            </div>
            <div class="q-text" id="qTextContainer"></div>
            <div class="q-hint" id="qHint">💡 提示词：<strong>excuse</strong></div>

            <!-- feedback -->
            <div class="feedback" id="feedback">
                <div class="fb-row">
                    <span id="fbIcon">✅</span>
                    <span id="fbMessage">回答正确！</span>
                    <span class="fb-answer" id="fbAnswer">答案：excuses</span>
                </div>
                <div class="fb-explanation" id="fbExplanation">解析：此处填名词作宾语。</div>
            </div>

            <!-- actions -->
            <div class="actions">
                <div class="actions-left">
                    <button class="btn btn-primary" id="submitBtn">✏️ 提交答案</button>
                    <button class="btn btn-success" id="nextBtn" disabled>➡️ 下一题</button>
                </div>
                <div class="actions-right">
                    <button class="btn btn-outline-secondary btn-sm" id="resetBtn">🔄 重新练习</button>
                    <button class="btn btn-outline btn-sm" id="errorBookBtn">📕 错题本</button>
                    <button class="btn btn-outline btn-sm" id="aiBankBtn" style="display:none;">🤖 AI 题库</button>
                </div>
            </div>
        </div>

        <div style="margin-top:10px;font-size:13px;color:#7a8fa8;text-align:center;border-top:1px solid #edf2f9;padding-top:14px;">
            💡 每次随机抽取 <strong>30</strong> 道 · 错题自动收录 · 错题优先出现 · 提交后显示解析
        </div>
    </div>

    <!-- ====== MODAL : 错题本 ====== -->
    <div class="modal-overlay" id="errorBookModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">📕 错题本</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span id="modalSubtitle" style="font-size:14px;color:#5f748f;">0 道</span>
                    <button class="modal-close" id="modalCloseBtn">✕</button>
                </div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn btn-sm" id="modalTabErrors" style="background:#1f3a5f;color:#fff;">📕 错题本</button>
                <button class="btn btn-sm btn-outline-secondary" id="modalTabAi" style="display:none;">🤖 AI 题库</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="ai-loading" id="aiLoading">
                <div class="spinner"></div>
                <div>🤖 AI 正在根据错题生成新句子…</div>
            </div>
            <div class="ai-result-actions" id="aiResultActions" style="display:none;">
                <button class="btn btn-success btn-sm" id="startAiRoundBtn">🚀 使用 AI 题目开始练习</button>
                <button class="btn btn-outline-secondary btn-sm" id="discardAiBtn">取消</button>
            </div>
            <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
                <button class="btn btn-primary btn-sm" id="aiGenerateBtn">🤖 AI 错题生成</button>
                <button class="btn btn-outline btn-sm" id="exportAiBtn" style="display:none;">📥 导出 JSON</button>
                <button class="btn btn-danger btn-sm" id="clearErrorsBtn">🗑️ 清空错题本</button>
                <button class="btn btn-outline-secondary btn-sm" id="clearAiBtn" style="display:none;">🗑️ 清空 AI 题</button>
                <button class="btn btn-primary btn-sm" id="modalCloseBtn2">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ======================================================================
        //  1. 题库数据 (110 道)  — 包含2019-2023五年真题 + 2024模拟新增
        // ======================================================================
        let QUESTION_BANK = [];

        // ======================================================================
        //  2. 应用状态
        // ======================================================================
        const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';
        let apiKey = localStorage.getItem('ds_api_key') || '';
        let apiVerified = false;
        let aiQuestions = [];

        const state = {
            allQuestions: QUESTION_BANK.slice(),
            currentQuestions: [],
            currentIndex: 0,
            answered: false,
            userInput: '',
            errorIds: new Set(),
            answeredCorrectIds: new Set(),
            answeredWrongIds: new Set(),
            correctCount: 0,
            wrongCount: 0,
            finished: false,
        };

        // ======================================================================
        //  3. DOM 引用
        // ======================================================================
        const $ = (sel) => document.querySelector(sel);
        const elTotalNum = $('#totalNum');
        const elCorrectNum = $('#correctNum');
        const elWrongNum = $('#wrongNum');
        const elProgressLabel = $('#progressLabel');
        const elErrorBookBadge = $('#errorBookBadge');
        const elProgressBar = $('#progressBar');
        const elQIdLabel = $('#qIdLabel');
        const elQSourceLabel = $('#qSourceLabel');
        const elQTextContainer = $('#qTextContainer');
        const elQHint = $('#qHint');
        const elFeedback = $('#feedback');
        const elFbIcon = $('#fbIcon');
        const elFbMessage = $('#fbMessage');
        const elFbAnswer = $('#fbAnswer');
        const elFbExplanation = $('#fbExplanation');
        const elSubmitBtn = $('#submitBtn');
        const elNextBtn = $('#nextBtn');
        const elResetBtn = $('#resetBtn');
        const elErrorBookBtn = $('#errorBookBtn');
        const elModal = $('#errorBookModal');
        const elModalClose = $('#modalCloseBtn');
        const elModalClose2 = $('#modalCloseBtn2');
        const elModalBody = $('#modalBody');
        const elModalTitle = $('#modalTitle');
        const elModalSubtitle = $('#modalSubtitle');
        const elModalTabErrors = $('#modalTabErrors');
        const elModalTabAi = $('#modalTabAi');
        const elClearErrorsBtn = $('#clearErrorsBtn');
        const elClearAiBtn = $('#clearAiBtn');
        const elExportAiBtn = $('#exportAiBtn');
        const elApiSettingsBtn = $('#apiSettingsBtn');
        const elAiBankBtn = $('#aiBankBtn');
        const elAiBankBadge = $('#aiBankBadge');
        const elApiPanel = $('#apiPanel');
        const elApiKeyInput = $('#apiKeyInput');
        const elVerifyApiBtn = $('#verifyApiBtn');
        const elApiStatus = $('#apiStatus');
        const elAiGenerateBtn = $('#aiGenerateBtn');
        const elAiLoading = $('#aiLoading');
        const elAiResultActions = $('#aiResultActions');
        const elStartAiRoundBtn = $('#startAiRoundBtn');
        const elDiscardAiBtn = $('#discardAiBtn');

        // ======================================================================
        //  4. 核心逻辑
        // ======================================================================

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pickQuestions() {
            const all = state.allQuestions;
            const errorIds = Array.from(state.errorIds);
            const errorQuestions = all.filter(q => errorIds.includes(q.id));
            const nonErrorQuestions = all.filter(q => !errorIds.includes(q.id));
            const maxErrors = Math.min(errorQuestions.length, 25);
            const selectedErrors = shuffle(errorQuestions).slice(0, maxErrors);
            const need = 30 - selectedErrors.length;
            const selectedNonErrors = shuffle(nonErrorQuestions).slice(0, need);
            let combined = [...selectedErrors, ...selectedNonErrors];
            if (combined.length < 30) {
                const extra = shuffle(all).filter(q => !combined.some(c => c.id === q.id));
                combined = combined.concat(extra.slice(0, 30 - combined.length));
            }
            return shuffle(combined);
        }

        function renderQuestion() {
            const qs = state.currentQuestions;
            if (!qs.length || state.currentIndex >= qs.length) {
                state.finished = true;
                elQTextContainer.innerHTML =
                    `<div style="text-align:center;padding:30px 0;color:#1f334f;font-size:18px;">🎉 恭喜你完成本轮练习！<br><span style="font-size:15px;color:#5f748f;">正确 ${state.correctCount} 题 · 错误 ${state.wrongCount} 题</span></div>`;
                elQHint.style.display = 'none';
                elFeedback.classList.remove('show');
                elSubmitBtn.disabled = true;
                elNextBtn.disabled = true;
                elProgressLabel.textContent = `${qs.length} / ${qs.length}`;
                elProgressBar.style.width = '100%';
                return;
            }

            const q = qs[state.currentIndex];
            const idx = state.currentIndex;
            const total = qs.length;

            elProgressLabel.textContent = `${idx + 1} / ${total}`;
            elProgressBar.style.width = `${((idx + 1) / total) * 100}%`;

            elQIdLabel.textContent = `第 ${idx + 1} 题`;
            elQSourceLabel.textContent = q.source || '基础题';

            const parts = q.text.split('______');
            let html = '';
            parts.forEach((part, i) => {
                html += part;
                if (i < parts.length - 1) {
                    html +=
                        `<input class="blank-input" id="blankInput" type="text" autocomplete="off" placeholder="填写" value="${state.userInput || ''}" />`;
                }
            });
            elQTextContainer.innerHTML = html;

            elQHint.innerHTML = `💡 提示词：<strong>${q.hint}</strong>`;
            elQHint.style.display = 'block';

            elFeedback.classList.remove('show', 'correct', 'wrong');
            elSubmitBtn.disabled = false;
            elNextBtn.disabled = true;
            state.answered = false;
            state.userInput = '';

            const input = document.getElementById('blankInput');
            if (input) {
                input.value = '';
                input.focus();
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSubmit();
                    }
                });
                input.addEventListener('input', (e) => {
                    state.userInput = e.target.value;
                });
            }

            updateStats();
        }

        function handleSubmit() {
            if (state.answered || state.finished) return;
            const qs = state.currentQuestions;
            if (!qs.length || state.currentIndex >= qs.length) return;

            const q = qs[state.currentIndex];
            const input = document.getElementById('blankInput');
            if (!input) return;
            const userVal = input.value.trim();
            if (userVal === '') {
                elFeedback.className = 'feedback show wrong';
                elFbIcon.textContent = '⚠️';
                elFbMessage.textContent = '请先填写答案！';
                elFbAnswer.textContent = '';
                elFbExplanation.textContent = '';
                return;
            }

            const isCorrect = userVal.toLowerCase() === q.answer.toLowerCase();
            state.answered = true;
            state.userInput = userVal;

            if (isCorrect) {
                state.correctCount++;
                state.answeredCorrectIds.add(q.id);
                if (state.errorIds.has(q.id)) {
                    state.errorIds.delete(q.id);
                }
                elFeedback.className = 'feedback show correct';
                elFbIcon.textContent = '✅';
                elFbMessage.textContent = '回答正确！';
                elFbAnswer.textContent = `答案：${q.answer}`;
                input.classList.add('correct');
                input.classList.remove('wrong');
            } else {
                state.wrongCount++;
                state.answeredWrongIds.add(q.id);
                state.errorIds.add(q.id);
                elFeedback.className = 'feedback show wrong';
                elFbIcon.textContent = '❌';
                elFbMessage.textContent = '回答错误';
                elFbAnswer.textContent = `正确答案：${q.answer}`;
                input.classList.add('wrong');
                input.classList.remove('correct');
            }
            elFbExplanation.textContent = `📖 解析：${q.explanation || '（无额外解析）'}`;

            elSubmitBtn.disabled = true;
            elNextBtn.disabled = false;
            input.disabled = true;
            updateStats();
            updateErrorBadge();
        }

        function goToNext() {
            if (!state.answered && !state.finished) return;
            state.currentIndex++;
            state.userInput = '';
            renderQuestion();
            if (state.finished) {
                elProgressLabel.textContent = `${state.currentQuestions.length} / ${state.currentQuestions.length}`;
                elProgressBar.style.width = '100%';
            }
        }

        function resetPractice() {
            const newQuestions = pickQuestions();
            state.currentQuestions = newQuestions;
            state.currentIndex = 0;
            state.answered = false;
            state.userInput = '';
            state.answeredCorrectIds = new Set();
            state.answeredWrongIds = new Set();
            state.correctCount = 0;
            state.wrongCount = 0;
            state.finished = false;
            elSubmitBtn.disabled = false;
            elNextBtn.disabled = true;
            renderQuestion();
            updateStats();
            updateErrorBadge();
        }

        function updateStats() {
            const total = state.currentQuestions.length || 0;
            elTotalNum.textContent = total;
            elCorrectNum.textContent = state.correctCount;
            elWrongNum.textContent = state.wrongCount;
            if (state.finished) {
                elProgressLabel.textContent = `${total} / ${total}`;
                elProgressBar.style.width = '100%';
            } else {
                const idx = state.currentIndex;
                elProgressLabel.textContent = `${Math.min(idx + 1, total)} / ${total}`;
            }
        }

        function updateErrorBadge() {
            const count = state.errorIds.size;
            elErrorBookBadge.textContent = `📕 错题 ${count}`;
        }

        function renderErrorBook() {
            const ids = Array.from(state.errorIds);
            elModalTitle.textContent = '📕 错题本';
            elModalSubtitle.textContent = `${ids.length} 道`;
            elModalTabErrors.style.background = '#1f3a5f';
            elModalTabErrors.style.color = '#fff';
            elModalTabAi.style.background = '';
            elModalTabAi.style.color = '';
            elAiGenerateBtn.style.display = '';
            elClearErrorsBtn.style.display = '';
            elClearAiBtn.style.display = 'none';
            elExportAiBtn.style.display = 'none';
            elAiResultActions.style.display = 'none';
            if (ids.length === 0) {
                elModalBody.innerHTML = `
                    <div class="empty-errors">
                        <span class="icon">🎉</span>
                        错题本为空，继续保持！
                    </div>
                `;
                return;
            }
            const errorItems = ids.map(id => state.allQuestions.find(q => q.id === id)).filter(Boolean);
            let html = '';
            errorItems.forEach((q, i) => {
                html += `
                    <div class="error-item">
                        <span class="e-index">#${i + 1}</span>
                        <span class="e-text">${q.text.replace('______', '_____')}</span>
                        <span class="e-answer">✅ ${q.answer}</span>
                    </div>
                `;
            });
            elModalBody.innerHTML = html;
        }

        function renderAiBank() {
            const items = loadAiQuestions();
            elModalTitle.textContent = '🤖 AI 题库';
            elModalSubtitle.textContent = `${items.length} 道`;
            elModalTabErrors.style.background = '';
            elModalTabErrors.style.color = '';
            elModalTabAi.style.background = '#1f3a5f';
            elModalTabAi.style.color = '#fff';
            elAiGenerateBtn.style.display = 'none';
            elClearErrorsBtn.style.display = 'none';
            elClearAiBtn.style.display = '';
            elExportAiBtn.style.display = '';
            elAiResultActions.style.display = 'none';
            if (items.length === 0) {
                elModalBody.innerHTML = `
                    <div class="empty-errors">
                        <span class="icon">📭</span>
                        暂无 AI 生成的题目
                    </div>
                `;
                return;
            }
            let html = '';
            items.forEach((q, i) => {
                html += `
                    <div class="error-item" style="border-color:#b7dfce;">
                        <span class="e-index">#${i + 1}</span>
                        <span class="e-text">${q.text.replace('______', '_____')}</span>
                        <span class="e-answer">✅ ${q.answer}</span>
                    </div>
                `;
            });
            elModalBody.innerHTML = html;
        }

        function openErrorBook() {
            renderErrorBook();
            elModal.classList.add('open');
        }

        function openAiBank() {
            renderAiBank();
            elModal.classList.add('open');
        }

        function closeErrorBook() {
            elModal.classList.remove('open');
        }

        function clearErrorBook() {
            if (state.errorIds.size === 0) return;
            if (confirm('确定要清空错题本吗？')) {
                state.errorIds.clear();
                updateErrorBadge();
                saveErrors();
                renderErrorBook();
                closeErrorBook();
                if (!state.finished) {
                    renderQuestion();
                    updateStats();
                }
            }
        }

        function saveErrors() {
            try {
                localStorage.setItem('errorBook_ids', JSON.stringify(Array.from(state.errorIds)));
            } catch (_) { /* ignore */ }
        }

        function loadErrors() {
            try {
                const saved = localStorage.getItem('errorBook_ids');
                if (saved) {
                    const ids = JSON.parse(saved);
                    if (Array.isArray(ids)) {
                        ids.forEach(id => state.errorIds.add(id));
                    }
                }
            } catch (_) { /* ignore */ }
        }

        function saveAiQuestions(items) {
            try {
                localStorage.setItem('ai_questions', JSON.stringify(items));
            } catch (_) {}
        }

        function loadAiQuestions() {
            try {
                const saved = localStorage.getItem('ai_questions');
                return saved ? JSON.parse(saved) : [];
            } catch (_) { return []; }
        }

        function updateAiBankBadge() {
            const items = loadAiQuestions();
            if (items.length > 0) {
                elAiBankBadge.style.display = '';
                elAiBankBadge.textContent = `🤖 AI 题 ${items.length}`;
                elAiBankBtn.style.display = '';
                elModalTabAi.style.display = '';
            } else {
                elAiBankBadge.style.display = 'none';
                elAiBankBtn.style.display = 'none';
                elModalTabAi.style.display = 'none';
            }
        }

        // ======================================================================
        //  5. 事件绑定
        // ======================================================================
        elSubmitBtn.addEventListener('click', handleSubmit);
        elNextBtn.addEventListener('click', goToNext);
        elResetBtn.addEventListener('click', resetPractice);
        elErrorBookBtn.addEventListener('click', openErrorBook);
        elModalClose.addEventListener('click', closeErrorBook);
        elModalClose2.addEventListener('click', closeErrorBook);
        elModal.addEventListener('click', (e) => {
            if (e.target === elModal) closeErrorBook();
        });
        elClearErrorsBtn.addEventListener('click', clearErrorBook);
        elAiBankBtn.addEventListener('click', openAiBank);

        elModalTabErrors.addEventListener('click', renderErrorBook);
        elModalTabAi.addEventListener('click', renderAiBank);

        elClearAiBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有 AI 生成的题目吗？')) {
                saveAiQuestions([]);
                updateAiBankBadge();
                renderAiBank();
            }
        });

        elExportAiBtn.addEventListener('click', () => {
            const items = loadAiQuestions();
            if (items.length === 0) return;
            const json = JSON.stringify(items, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ai_questions_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !state.answered && !state.finished) {
                const input = document.getElementById('blankInput');
                if (input && document.activeElement === input) {
                    e.preventDefault();
                    handleSubmit();
                }
            }
            if (e.key === 'Enter' && state.answered && !state.finished) {
                if (!elNextBtn.disabled) {
                    elNextBtn.click();
                }
            }
            if (e.key === 'Escape') {
                closeErrorBook();
            }
        });

        // ======================================================================
        //  6. 初始化
        // ======================================================================
        async function tryVerifySavedKey() {
            if (!apiKey) return;
            try {
                const ok = await verifyApiKey(apiKey);
                apiVerified = ok;
            } catch {
                apiVerified = false;
            }
        }

        async function loadQuestions() {
            try {
                const res = await fetch('english-questions.json?' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                QUESTION_BANK = await res.json();
            } catch {
                // fallback: 使用内置精简题库
                QUESTION_BANK = [
                    { id: 1, text: 'We should admit our mistakes bravely instead of making ______.', hint: 'excuse', answer: 'excuses', source: '基础', explanation: 'excuse → excuses，名词复数形式。' },
                    { id: 2, text: 'We heard a ______ sound after a bright flash of lightning.', hint: 'frighten', answer: 'frightening', source: '基础', explanation: 'frighten → frightening，形容词修饰 sound。' },
                    { id: 3, text: "I'm preparing for my grandma's ______ birthday party these days.", hint: 'ninety', answer: 'ninetieth', source: '基础', explanation: 'ninety → ninetieth，序数词。' },
                ];
            }
        }

        function init() {
            loadErrors();
            updateAiBankBadge();

            // 初始化题库 (QUESTION_BANK 已被 loadQuestions 填充)
            state.allQuestions = QUESTION_BANK.slice();

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('progressWrap').style.display = '';
            document.getElementById('questionCard').style.display = '';
            document.querySelector('.api-settings').style.display = '';

            if (apiKey) {
                tryVerifySavedKey().then(() => updateApiStatus());
            }
            state.currentQuestions = pickQuestions();
            state.currentIndex = 0;
            state.correctCount = 0;
            state.wrongCount = 0;
            state.finished = false;
            state.answered = false;
            state.userInput = '';
            renderQuestion();
            updateStats();
            updateErrorBadge();
            // 拦截错误集合变化以自动保存
            const origAdd = state.errorIds.add;
            const origDelete = state.errorIds.delete;
            const origClear = state.errorIds.clear;
            state.errorIds.add = function(val) {
                const result = origAdd.call(this, val);
                saveErrors();
                return result;
            };
            state.errorIds.delete = function(val) {
                const result = origDelete.call(this, val);
                saveErrors();
                return result;
            };
            state.errorIds.clear = function() {
                const result = origClear.call(this);
                saveErrors();
                return result;
            };
        }

        loadQuestions().then(init);

        // ======================================================================
        //  7. DeepSeek AI 集成
        // ======================================================================

        async function verifyApiKey(key) {
            const res = await fetch('https://api.deepseek.com/models', {
                headers: { 'Authorization': `Bearer ${key}` }
            });
            return res.ok;
        }

        async function generateWithAI(errorWords) {
            const prompt = `你是一名英语教师，正在出词形词性转化填空题。针对以下每个词根：${errorWords.join('、')}，各生成1道填空题，要求学生将词根变换为适当形式填入空白。

严格按以下JSON格式返回（只返回合法JSON数组，不要其他文字）：
{"text": "包含 ______ 空白的完整英文句子", "hint": "词根", "answer": "正确答案", "explanation": "简明中文解析，说明为什么填这个形式"}

要求：
- 句子地道自然，适合中学生水平
- hint 保持为给出的词根
- answer 为词根变换后的正确形式
- explanation 用中文解释词性变化原因
- 生成 ${errorWords.length} 个对象`;

            const res = await fetch(DEEPSEEK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.8,
                    max_tokens: 4096,
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`API 请求失败 (${res.status}): ${errText}`);
            }

            const data = await res.json();
            const content = data.choices?.[0]?.message?.content;
            if (!content) throw new Error('API 返回为空');

            let questions;
            try {
                const cleaned = content.replace(/```(?:json)?\s*([\s\S]*?)```/g, '$1').trim();
                questions = JSON.parse(cleaned);
                if (!Array.isArray(questions)) throw new Error('非数组');
            } catch {
                throw new Error('无法解析 AI 返回的题目格式');
            }

            aiQuestions = questions.map((q, i) => ({
                id: 2000 + i,
                text: q.text,
                hint: q.hint,
                answer: q.answer,
                source: '🤖 AI 生成',
                explanation: q.explanation || 'AI 生成的练习题',
            }));

            // 自动保存到本地
            const existing = loadAiQuestions();
            const merged = [...existing, ...aiQuestions];
            saveAiQuestions(merged);
            updateAiBankBadge();

            return aiQuestions;
        }

        // API 面板显示/隐藏
        elApiSettingsBtn.addEventListener('click', () => {
            const shown = elApiPanel.style.display !== 'none';
            elApiPanel.style.display = shown ? 'none' : 'flex';
            if (!shown) {
                elApiKeyInput.value = apiKey;
                elApiKeyInput.focus();
                updateApiStatus();
            }
        });

        // 验证 API Key
        elVerifyApiBtn.addEventListener('click', async () => {
            const key = elApiKeyInput.value.trim();
            if (!key) {
                elApiStatus.className = 'api-status err';
                elApiStatus.textContent = '请输入 Key';
                return;
            }
            elApiStatus.className = 'api-status loading';
            elApiStatus.textContent = '验证中…';
            elVerifyApiBtn.disabled = true;
            try {
                const ok = await verifyApiKey(key);
                if (ok) {
                    apiKey = key;
                    apiVerified = true;
                    localStorage.setItem('ds_api_key', key);
                    elApiStatus.className = 'api-status ok';
                    elApiStatus.textContent = '✅ 已验证';
                } else {
                    apiVerified = false;
                    elApiStatus.className = 'api-status err';
                    elApiStatus.textContent = '❌ Key 无效';
                }
            } catch {
                apiVerified = false;
                elApiStatus.className = 'api-status err';
                elApiStatus.textContent = '❌ 网络错误';
            } finally {
                elVerifyApiBtn.disabled = false;
            }
        });

        function updateApiStatus() {
            if (apiVerified && apiKey) {
                elApiStatus.className = 'api-status ok';
                elApiStatus.textContent = '✅ 已连接';
            } else if (apiKey) {
                elApiStatus.className = 'api-status err';
                elApiStatus.textContent = '❌ Key 未验证';
            } else {
                elApiStatus.className = '';
                elApiStatus.textContent = '';
            }
        }

        // AI 生成
        elAiGenerateBtn.addEventListener('click', async () => {
            if (!apiVerified || !apiKey) {
                alert('请先点击 "🔑 API" 输入并验证 DeepSeek API Key');
                elApiPanel.style.display = 'flex';
                elApiKeyInput.focus();
                return;
            }

            const errorIds = Array.from(state.errorIds);
            if (errorIds.length === 0) {
                alert('错题本为空，无需生成');
                return;
            }

            const errorWords = errorIds
                .map(id => state.allQuestions.find(q => q.id === id))
                .filter(Boolean)
                .map(q => q.hint);
            const uniqueWords = [...new Set(errorWords)];

            elAiLoading.classList.add('show');
            elAiGenerateBtn.disabled = true;
            elAiResultActions.style.display = 'none';

            try {
                const generated = await generateWithAI(uniqueWords);
                let html = `<div style="font-size:14px;font-weight:600;color:#1f9d6a;margin-bottom:10px;">✅ AI 生成了 ${generated.length} 道新题目</div>`;
                generated.forEach((q, i) => {
                    html += `
                        <div class="error-item" style="border-color:#b7dfce;">
                            <span class="e-index">#${i + 1}</span>
                            <span class="e-text">${q.text.replace('______', '_____')}</span>
                            <span class="e-answer">✅ ${q.answer}</span>
                        </div>
                    `;
                });
                elModalBody.innerHTML = html;
                elAiResultActions.style.display = 'flex';
            } catch (err) {
                elModalBody.innerHTML = `
                    <div class="empty-errors">
                        <span class="icon">😵</span>
                        ${err.message}
                    </div>
                `;
            } finally {
                elAiLoading.classList.remove('show');
                elAiGenerateBtn.disabled = false;
            }
        });

        elStartAiRoundBtn.addEventListener('click', () => {
            if (aiQuestions.length === 0) return;

            const newBank = [...state.allQuestions, ...aiQuestions];
            const origPick = pickQuestions;

            state.allQuestions = newBank;
            const newQuestions = pickQuestions();
            state.currentQuestions = newQuestions;
            state.currentIndex = 0;
            state.answered = false;
            state.userInput = '';
            state.answeredCorrectIds = new Set();
            state.answeredWrongIds = new Set();
            state.correctCount = 0;
            state.wrongCount = 0;
            state.finished = false;
            elSubmitBtn.disabled = false;
            elNextBtn.disabled = true;

            closeErrorBook();
            renderQuestion();
            updateStats();
            updateErrorBadge();
        });

        elDiscardAiBtn.addEventListener('click', () => {
            aiQuestions = [];
            elAiResultActions.style.display = 'none';
            renderErrorBook();
        });
    </script>
</body>
</html>
