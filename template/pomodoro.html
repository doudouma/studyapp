<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄时钟 · 让专注自然生长</title>
<style>
  :root {
    --bg-1: #fff8e7; --bg-1b: #f5e6d3;
    --bg-2: #e8f5e9; --bg-2b: #d4edda;
    --bg-3: #e0f2f1; --bg-3b: #b2dfdb;
    --bg-4: #fff9e6; --bg-4b: #ffe0b2;
    --bg-5: #fff0e6; --bg-5b: #ffccbc;
    --bg-6: #ffebee; --bg-6b: #ffcdd2;
    --ring-1: #e6d0b3; --ring-2: #81c784; --ring-3: #4db6ac;
    --ring-4: #ffb74d; --ring-5: #ff8a65; --ring-6: #e57373;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #3e3e3e;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
    padding: 0;
  }

  .app {
    width: 100%;
    height: 100%;
    max-width: 420px;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-1b) 100%);
    transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @media (min-width: 480px) {
    .app {
      height: auto;
      min-height: 700px;
      border-radius: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.18);
    }
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    flex-shrink: 0;
  }

  .header button {
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(255,255,255,0.45);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s, background .2s;
    backdrop-filter: blur(4px);
  }

  .header button:hover { background: rgba(255,255,255,0.7); transform: scale(1.05); }

  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #5a5a5a; }

  .icon-menu, .icon-sound {
    width: 20px;
    height: 20px;
    stroke: #5a5a5a;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-sound-off { display: none; }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    position: relative;
  }

  /* Timer ring */
  .timer-wrap {
    position: relative;
    width: min(76vw, 320px);
    aspect-ratio: 1;
    margin-bottom: 36px;
  }

  .timer-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .timer-bg {
    fill: none;
    stroke: rgba(0,0,0,0.06);
    stroke-width: 8;
  }

  .timer-progress {
    fill: none;
    stroke: var(--ring-1);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 880;
    stroke-dashoffset: 0;
    transition: stroke 1.5s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 1s linear;
  }

  .status {
    text-align: center;
    margin-bottom: 36px;
    min-height: 72px;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  .status.fading {
    opacity: 0;
  }

  .plant-stage {
    position: absolute;
    inset: 0;
    bottom: -108px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .plant-stage img {
    width: 52%;
    height: auto;
    object-fit: contain;
    image-rendering: auto;
    transition: opacity .3s ease;
  }

  .time-display {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(40px, 12vw, 64px);
    font-weight: 500;
    letter-spacing: 2px;
    color: #3e3e3e;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 2px 12px rgba(255,255,255,0.6);
  }

  /* Status text */
  .status h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #3e3e3e;
  }

  .status p {
    font-size: 14px;
    color: #7a7a7a;
    line-height: 1.5;
  }

  /* Controls */
  .controls {
    flex-shrink: 0;
    padding: 0 32px 44px;
    display: flex;
    justify-content: center;
  }

  .btn {
    min-width: 160px;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .2s, box-shadow .2s, background .2s;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .btn:active { transform: translateY(0); }

  .btn-pause {
    background: rgba(255,255,255,0.65);
    color: #5a5a5a;
    backdrop-filter: blur(6px);
  }

  .btn-complete {
    background: #e57373;
    color: #fff;
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity .6s ease;
  }

  .confetti.active { opacity: 1; }

  .confetti span {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: fall 2.5s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none; }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <button aria-label="菜单"><svg class="icon-menu" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      <h1>专注中</h1>
      <button id="soundBtn" aria-label="声音"><svg class="icon-sound" id="soundOn" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><svg class="icon-sound icon-sound-off" id="soundOff" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></button>
    </header>

    <main class="main">
      <div class="timer-wrap">
        <svg class="timer-svg" viewBox="0 0 320 320">
          <circle class="timer-bg" cx="160" cy="160" r="140"/>
          <circle class="timer-progress" id="progressRing" cx="160" cy="160" r="140"/>
        </svg>
        <div class="plant-stage"><img id="plantImg" src="../spritesheet2/frame_00.png" alt="番茄生长"></div>
        <div class="time-display" id="timeDisplay">25:00</div>
      </div>

      <div class="status">
        <h2 id="stageTitle">种下专注的种子</h2>
        <p id="stageDesc">保持专注，番茄会慢慢长大</p>
      </div>
    </main>

    <div class="controls">
      <button class="btn btn-pause" id="pauseBtn">
        <span id="pauseText">暂停</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="4" x2="10" y2="20"/><line x1="14" y1="4" x2="14" y2="20"/></svg>
      </button>
      <button class="btn btn-complete hidden" id="completeBtn">
        完成
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>

    <div class="confetti" id="confetti"></div>
  </div>

<script>
// 测试模式：25 秒模拟 25 分钟。正式上线可改回 25 * 60
const TOTAL_SECONDS = 25;

// 阶段文案（离散切换）
const STAGES = [
  { pct: 1.00, frame: 0,  title: "种下专注的种子", desc: "保持专注，番茄会慢慢长大" },
  { pct: 0.82, frame: 5,  title: "番茄发芽了",       desc: "继续加油，它需要你的专注" },
  { pct: 0.61, frame: 10, title: "长出新叶了",       desc: "专注让它茁壮成长" },
  { pct: 0.43, frame: 17, title: "即将开花",         desc: "再坚持一下就能看到花朵了" },
  { pct: 0.22, frame: 28, title: "小番茄出现了",     desc: "快完成啦，番茄在等你！" },
  { pct: 0.00, frame: 38, title: "番茄成熟啦！",     desc: "收获你的专注成果🍅" },
];

// 颜色关键帧（按时间进度插值）
const COLOR_STOPS = [
  { pct: 1.00, bgTop: "#fff8e7", bgBot: "#f5e6d3", ring: "#e6d0b3" },
  { pct: 0.82, bgTop: "#e8f5e9", bgBot: "#d4edda", ring: "#81c784" },
  { pct: 0.61, bgTop: "#e0f2f1", bgBot: "#b2dfdb", ring: "#4db6ac" },
  { pct: 0.43, bgTop: "#fff9e6", bgBot: "#ffe0b2", ring: "#ffb74d" },
  { pct: 0.22, bgTop: "#fff0e6", bgBot: "#ffccbc", ring: "#ff8a65" },
  { pct: 0.00, bgTop: "#ffebee", bgBot: "#ffcdd2", ring: "#e57373" },
];

let remaining = TOTAL_SECONDS;
let running = true;
let timerId = null;
let currentStageTitle = "";
let audioCtx = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    audioCtx = new AC();
  } catch (e) {
    audioCtx = null;
  }
}

['click', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, initAudio, { once: true });
});

const app = document.getElementById('app');
const timeDisplay = document.getElementById('timeDisplay');
const headerTitle = document.querySelector('.header h1');
const ring = document.getElementById('progressRing');
const plantImg = document.getElementById('plantImg');
const stageTitle = document.getElementById('stageTitle');
const stageDesc = document.getElementById('stageDesc');
const pauseBtn = document.getElementById('pauseBtn');
const pauseText = document.getElementById('pauseText');
const completeBtn = document.getElementById('completeBtn');
const confetti = document.getElementById('confetti');
const soundBtn = document.getElementById('soundBtn');
const soundOn = document.getElementById('soundOn');
const soundOff = document.getElementById('soundOff');

const CIRCUMFERENCE = 2 * Math.PI * 140;
ring.style.strokeDasharray = CIRCUMFERENCE;

function getStage(pct) {
  for (let i = 0; i < STAGES.length - 1; i++) {
    if (pct >= STAGES[i + 1].pct) return STAGES[i];
  }
  return STAGES[STAGES.length - 1];
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}

function getColors(pct) {
  let start = COLOR_STOPS[0], end = COLOR_STOPS[COLOR_STOPS.length - 1], t = 0;
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    const s = COLOR_STOPS[i], e = COLOR_STOPS[i + 1];
    if (pct <= s.pct && pct >= e.pct) {
      start = s; end = e;
      t = (pct - e.pct) / (s.pct - e.pct || 1);
      break;
    }
  }
  return {
    bgTop: lerpColor(start.bgTop, end.bgTop, t),
    bgBot: lerpColor(start.bgBot, end.bgBot, t),
    ring: lerpColor(start.ring, end.ring, t),
  };
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateUI() {
  const pct = remaining / TOTAL_SECONDS;
  const stage = getStage(pct);
  const colors = getColors(pct);

  // Time
  timeDisplay.textContent = formatTime(remaining);

  // Background gradient（随时间连续变化）
  app.style.background = `linear-gradient(180deg, ${colors.bgTop} 0%, ${colors.bgBot} 100%)`;

  // Ring progress（色环随时间连续变化）
  ring.style.stroke = colors.ring;
  const offset = CIRCUMFERENCE * (1 - pct);
  ring.style.strokeDashoffset = Math.max(0, offset);

  // Plant frame: interpolate between stage frame and next stage frame
  const nextStage = STAGES[STAGES.indexOf(stage) + 1] || STAGES[STAGES.length - 1];
  const segmentPct = (pct - nextStage.pct) / (stage.pct - nextStage.pct || 1);
  const frame = Math.round(stage.frame + (nextStage.frame - stage.frame) * (1 - segmentPct));
  plantImg.src = `../spritesheet2/frame_${Math.min(38, Math.max(0, frame)).toString().padStart(2, '0')}.png`;

  // Text（阶段切换时渐隐渐显）
  if (stage.title !== currentStageTitle) {
    currentStageTitle = stage.title;
    const statusEl = document.querySelector('.status');
    statusEl.classList.add('fading');
    setTimeout(() => {
      stageTitle.textContent = stage.title;
      stageDesc.textContent = stage.desc;
      statusEl.classList.remove('fading');
    }, 400);
  }

  // Completion
  if (remaining <= 0) {
    complete();
  }
}

function playCompletionSound() {
  initAudio();
  const ctx = audioCtx;
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  if (ctx.state === 'closed') { audioCtx = null; return; }

  try {
    const melody = [
      { f: 523.25, d: 0.18 }, // C5
      { f: 659.25, d: 0.18 }, // E5
      { f: 783.99, d: 0.18 }, // G5
      { f: 1046.50, d: 0.45 }, // C6
    ];

    let t = ctx.currentTime + 0.05;
    melody.forEach(note => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(note.f, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.25, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + note.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + note.d);
      t += note.d + 0.05;
    });
  } catch (e) {
    console.warn('Sound play failed:', e);
  }
}

function complete() {
  running = false;
  clearInterval(timerId);
  pauseBtn.classList.add('hidden');
  completeBtn.classList.remove('hidden');
  confetti.classList.add('active');
  headerTitle.textContent = "专注完成！";
  stageTitle.textContent = "番茄成熟啦！";
  stageDesc.textContent = "收获你的专注成果🍅";
  makeConfetti();
  playCompletionSound();
  if (navigator.vibrate) {
    navigator.vibrate([300, 150, 300, 150, 500]);
  }
}

function makeConfetti() {
  confetti.innerHTML = '';
  const colors = ['#ff8a65', '#81c784', '#4db6ac', '#ffb74d', '#e57373', '#64b5f6'];
  for (let i = 0; i < 40; i++) {
    const span = document.createElement('span');
    span.style.left = Math.random() * 100 + '%';
    span.style.top = -20 - Math.random() * 80 + 'px';
    span.style.background = colors[Math.floor(Math.random() * colors.length)];
    span.style.animationDelay = Math.random() * 2 + 's';
    span.style.animationDuration = 2 + Math.random() * 2 + 's';
    confetti.appendChild(span);
  }
}

function tick() {
  if (!running) return;
  if (remaining > 0) {
    remaining--;
    updateUI();
  }
}

function togglePause() {
  running = !running;
  if (running) {
    pauseText.textContent = "暂停";
  } else {
    pauseText.textContent = "继续";
  }
}

function reset() {
  remaining = TOTAL_SECONDS;
  running = true;
  headerTitle.textContent = "专注中";
  pauseText.textContent = "暂停";
  pauseBtn.classList.remove('hidden');
  completeBtn.classList.add('hidden');
  confetti.classList.remove('active');
  confetti.innerHTML = '';
  updateUI();
  timerId = setInterval(tick, 1000);
}

pauseBtn.addEventListener('click', togglePause);
completeBtn.addEventListener('click', reset);

let soundEnabled = true;
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundOn.style.display = soundEnabled ? 'block' : 'none';
  soundOff.style.display = soundEnabled ? 'none' : 'block';
});

updateUI();
timerId = setInterval(tick, 1000);
</script>
</body>
</html>
